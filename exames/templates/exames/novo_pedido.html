{% extends 'base_prontuario.html' %}
{% block 'prontuario' %}
<div class="container mt-4">
    <h3 class="titulo">Novo Pedido de Exames</h3>
    <p>Paciente: <strong>{{ paciente.nome }}</strong> | Evolução: {{ evolucao.titulo }}</p>

    <form method="POST" id="form-pedido">
        {% csrf_token %}
        {{ form.as_p }}

        <h5 class="mt-4">Exames solicitados</h5>
        <div class="input-group mb-3">
            <input type="text" id="busca-exame" class="form-control"
                   placeholder="Buscar exame por nome (favoritos primeiro)..." autocomplete="off">
            <div class="input-group-append">
                <button type="button" class="btn btn-outline-secondary" id="btn-buscar">Buscar</button>
            </div>
        </div>
        <div id="resultados-busca" class="list-group mb-3"></div>

        <div id="exames-selecionados" class="mb-3"></div>

        <button type="submit" class="btn btn-primary">Gerar Pedido</button>
        <a href="{% url 'evolucoes:detalhe_evolucao' evolucao.id %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const busca = document.getElementById('busca-exame');
    const resultados = document.getElementById('resultados-busca');
    const selecionados = document.getElementById('exames-selecionados');
    let idsExcluidos = [];

    function buscar() {
        const q = busca.value;
        fetch(`/exames/buscar/?q=${encodeURIComponent(q)}&exclude=${idsExcluidos.join(',')}`)
            .then(r => r.json())
            .then(data => {
                resultados.innerHTML = '';
                data.forEach(exame => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                    const star = exame.uso_count > 5 ? '⭐ ' : '';
                    item.innerHTML = `<span>${star}${exame.nome} <small class="text-muted">${exame.categoria}</small></span>
                        <span class="badge badge-primary badge-pill">${exame.uso_count}x usado</span>`;
                    item.onclick = () => adicionar(exame);
                    resultados.appendChild(item);
                });
            });
    }

    function adicionar(exame) {
        idsExcluidos.push(exame.id);
        const card = document.createElement('div');
        card.className = 'card mb-2';
        card.dataset.id = exame.id;
        card.innerHTML = `
            <div class="card-body d-flex justify-content-between align-items-center py-2">
                <div>
                    <strong>${exame.nome}</strong> <small class="text-muted">(${exame.categoria})</small>
                    <input type="hidden" name="exame_ids" value="${exame.id}">
                </div>
                <div class="d-flex align-items-center">
                    <input type="text" name="instrucoes_${exame.id}" class="form-control form-control-sm mr-2"
                           style="width:180px" placeholder="Instruções...">
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            onclick="remover(this, ${exame.id})">×</button>
                </div>
            </div>`;
        selecionados.appendChild(card);
        resultados.innerHTML = '';
        busca.value = '';
    }

    window.remover = function(btn, id) {
        idsExcluidos = idsExcluidos.filter(i => i !== id);
        btn.closest('.card').remove();
    };

    document.getElementById('btn-buscar').onclick = buscar;
    busca.addEventListener('keyup', e => { if(e.key==='Enter') buscar(); });
    busca.addEventListener('input', () => { if(busca.value.length>=2) buscar(); });
});
</script>
{% endblock %}
